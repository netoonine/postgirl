name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tipos, formatação e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: CLI de ponta a ponta
        run: |
          npm run test:server &
          sleep 1
          node bin/postgirl.js run test/fixtures/demo.postman_collection.json \
            -e test/fixtures/demo.postman_environment.json -d test/fixtures/demo-data.csv \
            -r cli,junit --reporter-junit-export reports/cli.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: relatorio-cli
          path: reports/

  e2e:
    name: E2E (app Electron)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e
        env:
          E2E_SCREENSHOTS: e2e-screenshots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-screenshots/
